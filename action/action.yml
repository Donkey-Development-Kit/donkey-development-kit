# The scan-and-publish GitHub Action (#219): `donkey publish` from CI.
#
#   - uses: Donkey-Development-Kit/donkey-development-kit/action@<ref>  # a release tag or a commit SHA
#     with:
#       client-id: ${{ secrets.ANYPOINT_CLIENT_ID }}
#       client-secret: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
#       org-id: ${{ secrets.ANYPOINT_ORG_ID }}
#
# It installs donkey-kit from this checkout of the repository, so the action at
# a ref always runs the SDK at the same ref, into its own virtual environment:
# the job's Python, PATH and environment are left as they were. run.py runs the command and
# writes the job summary and the outputs. Inputs reach the scripts only through
# env, never through ${{ }} in a run: body.
name: Donkey scan and publish
description: Scan a repository's MCP servers and publish what changed to Anypoint Exchange.
author: Donkey Development Kit
branding:
  icon: upload-cloud
  color: orange

inputs:
  path:
    description: The repository directory (or one .py file) to scan and publish.
    default: "."
  dry-run:
    description: Print the plan in the job summary and send nothing. Needs no credentials; use it on pull requests.
    default: "false"
  if-changed:
    description: Skip an asset whose latest published version has the same digest. "false" publishes anyway (--always).
    default: "true"
  client-id:
    description: The connected app's client ID (ANYPOINT_CLIENT_ID). Leave empty to use the job's environment.
    default: ""
  client-secret:
    description: The connected app's client secret (ANYPOINT_CLIENT_SECRET). Pass it from secrets.* only; any other value shows in the log once before the action can mask it.
    default: ""
  org-id:
    description: The business group's organization ID (ANYPOINT_ORG_ID), also the default Exchange group ID.
    default: ""
  python-version:
    description: The Python that runs donkey-kit (3.10 or later).
    default: "3.12"
  donkey-kit:
    description: A pip requirement to install instead of this checkout's donkey-kit, for example "donkey-kit[cli]==0.2.0".
    default: ""

outputs:
  published:
    description: How many assets were published.
    value: ${{ steps.publish.outputs.published }}
  unchanged:
    description: How many assets were left unchanged.
    value: ${{ steps.publish.outputs.unchanged }}
  incomplete:
    description: How many assets have their version published but not their endpoint, page, or name and description. A rerun finishes them.
    value: ${{ steps.publish.outputs.incomplete }}
  failed:
    description: How many assets Exchange refused, with nothing published for them.
    value: ${{ steps.publish.outputs.failed }}
  not-attempted:
    description: How many assets were not tried because an earlier one failed.
    value: ${{ steps.publish.outputs.not_attempted }}
  result:
    description: The path of the JSON that donkey publish --json printed.
    value: ${{ steps.publish.outputs.result }}

runs:
  using: composite
  steps:
    # First, so the mask is in place before anything else in the action runs
    # (#1442). A `secrets.*` value is masked by the runner already. Any other
    # value shows once, in this step's env: header, which the runner prints
    # before the step can mask it: that is why the input must be a secret.
    - name: Mask the client secret
      shell: bash
      env:
        CLIENT_SECRET: ${{ inputs.client-secret }}
      run: if [ -n "$CLIENT_SECRET" ]; then echo "::add-mask::$CLIENT_SECRET"; fi
    - id: python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        update-environment: false
    - id: install
      name: Install donkey-kit
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        REQUIREMENT: ${{ inputs.donkey-kit }}
        SOURCE: ${{ github.action_path }}/../python
      run: |
        "$PYTHON" -m venv "$RUNNER_TEMP/donkey-kit"
        if [ -x "$RUNNER_TEMP/donkey-kit/bin/python" ]; then
          venv_python="$RUNNER_TEMP/donkey-kit/bin/python"
        else
          venv_python="$RUNNER_TEMP/donkey-kit/Scripts/python.exe"
        fi
        "$venv_python" -m pip install --quiet --disable-pip-version-check "${REQUIREMENT:-$SOURCE[cli]}"
        echo "python=$venv_python" >> "$GITHUB_OUTPUT"
    - id: publish
      name: donkey publish
      shell: bash
      env:
        PYTHON: ${{ steps.install.outputs.python }}
        RUN_PY: ${{ github.action_path }}/run.py
        INPUT_PATH: ${{ inputs.path }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_IF_CHANGED: ${{ inputs.if-changed }}
        INPUT_CLIENT_ID: ${{ inputs.client-id }}
        INPUT_CLIENT_SECRET: ${{ inputs.client-secret }}
        INPUT_ORG_ID: ${{ inputs.org-id }}
      run: |
        "$PYTHON" "$RUN_PY"
