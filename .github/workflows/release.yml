# Release: build the distribution and publish it to PyPI via Trusted Publishing
# (#206). No long-lived API token exists anywhere — PyPI mints a short-lived
# OIDC token for this workflow at run time, keyed on the repo + this filename +
# the GitHub Environment. The trust must be registered once on PyPI/TestPyPI
# ("pending publisher" flow) with the exact values documented in docs/releasing.md.
#
# Two trigger paths, one per destination (#410):
#
#   - workflow_dispatch (manual "Run workflow") -> TestPyPI. The dev-snapshot
#     dry-run: bump the `version` to the next `.devN`, run the workflow on that
#     ref, and it publishes to TestPyPI via OIDC — exercising the exact
#     trusted-publishing path prod uses. Dev builds are deliberately NOT GitHub
#     Releases (the Releases page is reserved for real releases).
#   - release: published, NOT a pre-release -> production PyPI. The first
#     published GitHub Release is `0.1.0`; that (and every later final X.Y.Z)
#     routes to prod. A pre-release Release, if one is ever cut, is routed to
#     TestPyPI too — a belt-and-braces guard so a pre-release never hits prod.
#
# A manual dispatch is structurally incapable of reaching prod: publish-pypi
# gates on `github.event_name == 'release'`. This workflow does NOT create tags
# or releases; it reacts to them (ddk-release owns cutting the release).
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege by default; only the publish jobs opt into id-token below.
permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build
        run: |
          pip install build twine
          python -m build
      - name: twine check (PyPI long description renders cleanly)
        run: twine check dist/*
      - name: Floors, never ceilings (§8.4) — no upper pins in the built metadata
        # A release is the last place an accidental upper pin could slip into what
        # consumers resolve. Read the actual wheel metadata (not the source
        # pyproject) and inspect ONLY the version specifier — everything before the
        # ';' environment marker — so the 'extra == ...' and 'python_version < ...'
        # markers are never mistaken for a dependency ceiling. Flag <, <=, ==, ~=,
        # != : anything that is not a bare >= floor.
        run: |
          pins="$(unzip -p dist/*.whl '*/METADATA' \
            | sed -n 's/^Requires-Dist: //p' \
            | sed 's/;.*//' \
            | grep -E '(<|~=|==|!=)' || true)"
          if [ -n "$pins" ]; then
            echo "::error::Upper version pins found in built metadata (floors-never-ceilings, §8.4):"
            echo "$pins"
            exit 1
          fi
          echo "Requires-Dist carries only >= floors."
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish-testpypi:
    name: Publish to TestPyPI (dev dry-run / pre-release)
    needs: build
    # Manual dispatch (the dev-snapshot dry-run) always lands here; a published
    # pre-release Release, if one is ever cut, is routed here too — never prod.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == true }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing; no stored secret.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    name: Publish to PyPI (final release)
    needs: build
    # Prod requires a *published, non-pre-release* GitHub Release. The explicit
    # event_name check means a manual dispatch can never reach prod.
    if: ${{ github.event_name == 'release' && github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing; no stored secret.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
