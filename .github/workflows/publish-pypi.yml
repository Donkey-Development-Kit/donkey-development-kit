# Publish to PyPI (production) via Trusted Publishing (OIDC) — #206/#410/#674.
# No long-lived token exists: PyPI mints a short-lived OIDC token keyed on the
# repo + THIS filename (publish-pypi.yml) + the `pypi` Environment. The trust is
# registered once on PyPI's web UI (see docs/releasing.md). This file reaches
# production ONLY — it has no workflow_dispatch trigger. A pre-release GitHub
# Release publishes NOWHERE (the prerelease == false guard stays). This workflow
# never creates tags/releases; ddk-release owns that and this reacts.
name: Publish to PyPI

on:
  release:
    types: [published]

# Least privilege by default; only the publish job opts into id-token below.
permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build
        run: |
          pip install build twine
          python -m build
      - name: twine check (PyPI long description renders cleanly)
        run: twine check dist/*
      - name: no tenant identifiers or live platform hosts in the built dists (#821)
        # PyPI releases are immutable: this is the last chance to catch one.
        run: python scripts/scrub_fixtures.py --check dist/*
      - name: Floors, never ceilings (§8.4) — no upper pins in the built metadata
        # A release is the last place an accidental upper pin could slip into what
        # consumers resolve. Read the actual wheel metadata (not the source
        # pyproject) and inspect ONLY the version specifier — everything before the
        # ';' environment marker — so the 'extra == ...' and 'python_version < ...'
        # markers are never mistaken for a dependency ceiling. Flag <, <=, ==, ~=,
        # != : anything that is not a bare >= floor.
        run: |
          pins="$(unzip -p dist/*.whl '*/METADATA' \
            | sed -n 's/^Requires-Dist: //p' \
            | sed 's/;.*//' \
            | grep -E '(<|~=|==|!=)' || true)"
          if [ -n "$pins" ]; then
            echo "::error::Upper version pins found in built metadata (floors-never-ceilings, §8.4):"
            echo "$pins"
            exit 1
          fi
          echo "Requires-Dist carries only >= floors."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: python/dist/

  publish-pypi:
    name: Publish to PyPI (final release)
    needs: build
    # Prod requires a *published, non-pre-release* GitHub Release. The explicit
    # event_name check means a manual dispatch can never reach prod — but this
    # workflow has no workflow_dispatch trigger at all, so that can't happen.
    if: ${{ github.event_name == 'release' && github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing; no stored secret.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
