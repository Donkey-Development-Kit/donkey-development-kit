# Nightly framework matrix (§8.4, BG §1.8).
#
# Purpose: catch upstream framework churn early for the CONFORMANCE-TESTED
# adapter(s). Each adapter targets class names/kwargs recorded in
# docs/verified-apis.md §8; when a framework renames a class or changes a
# signature, the verification harness turns red here *before* a user hits it.
#
# Scope (#197): the roster is "one deep, seven shallow" — only LangGraph is
# conformance-tested, so it is the only framework in this matrix. The other seven
# are supported at connection_kwargs() only; their governed-kwargs shape is
# guarded by the blocking unit suite (tests/unit/test_adapter_ergonomics.py), and
# their native-constructor signatures can be checked on demand with
# `python scripts/verify_frameworks.py` (FRAMEWORKS there stays the full roster).
# A demoted framework rejoins this matrix when demand promotes it to deep support
# (#223/#244).
#
# What runs per framework:
#   1. verify_frameworks.py --only <fw>  — signature check (offline). Fails the job
#      if an INSTALLED framework's class/kwarg signature no longer matches §8.
#   2. examples/<fw>/main.py             — smoke: must exit 0 with no creds set
#      (each example prints setup guidance and exits cleanly when unconfigured).
#   3. pytest                            — the unit + ergonomics suites.
#
# NOTE (known constraint): the extras carry no `openai` upper bound ("floors,
# never ceilings"), so a fresh resolve may pull openai 3.x / vendored httpx2,
# which breaks the httpx transport injection the SDK is verified against (openai
# 1.x). If a framework job fails on that, it is EXPECTED signal, not a flake —
# see the pending openai-version decision in docs/m1-completion-checklist.md §3.
#
# Live verification (a real proxy round-trip) is intentionally NOT in the nightly
# run: it needs sandbox credentials. Trigger it manually via workflow_dispatch
# with `live: true` and the MULESOFT_LLM_PROXY_* repo secrets configured.
#
# Security: matrix values and inputs are passed into steps via `env:` and
# referenced as shell variables (never interpolated directly into run: bodies),
# per the GitHub Actions injection-hardening guidance.

name: nightly-framework-matrix

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      live:
        description: "Run a live proxy round-trip (requires MULESOFT_LLM_PROXY_* secrets)"
        type: boolean
        default: false

# Least privilege: the matrix only reads the checkout, never writes back.
permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  # Base gates on the framework-free core — must pass regardless of any framework.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (dev + llm, no framework)
        run: pip install -e ".[dev,llm,cli]"
      - run: ruff check .
      - run: mypy
      - run: lint-imports
      - run: pytest -q

  matrix:
    runs-on: ubuntu-latest
    # Don't let one framework's upstream break cancel the others — we want the
    # full per-framework signal every night.
    strategy:
      fail-fast: false
      matrix:
        # The conformance-tested roster (BG §1.8, #197): only LangGraph. Every
        # key MUST have a matching pyproject extra AND an examples/<key>/main.py;
        # the "reject unwired framework" guard step below fails fast (with a clear
        # message) if a stray key is added, so the list can't silently drift into
        # permanently-red jobs again (#140). To promote another framework to deep
        # support (#223/#244), add its key here AND flip conformance_tested=True in
        # the ADAPTERS registry. The other seven frameworks are supported at
        # connection_kwargs() only and are covered by the blocking unit suite, not
        # this matrix. `donkey.openai()` is a separate raw-client method (#277).
        framework:
          - langgraph
    name: verify (${{ matrix.framework }})
    env:
      # Bind the matrix value to an env var so it is never interpolated into a
      # run: body directly (injection hardening).
      FRAMEWORK: ${{ matrix.framework }}
      RUN_LIVE: ${{ inputs.live }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Fail fast and loud if the matrix names a framework that isn't actually
      # wired (no examples/<fw>/main.py) — a stray entry would otherwise die with
      # a cryptic `pip install` exit 2 and read as an upstream break (#140).
      - name: Reject unwired framework (matrix drift guard)
        run: |
          if [ ! -f "examples/${FRAMEWORK}/main.py" ]; then
            echo "::error::'${FRAMEWORK}' has no examples/${FRAMEWORK}/main.py — not a wired framework. The matrix list must match the supported set (source of truth: scripts/verify_frameworks.py FRAMEWORKS + pyproject extras + examples/)."
            exit 1
          fi

      - name: Install SDK + framework extra
        run: pip install -e ".[dev,llm,${FRAMEWORK}]"

      - name: Signature verification (§8)
        run: python scripts/verify_frameworks.py --only "${FRAMEWORK}"

      - name: Example smoke (must exit 0 without creds)
        run: python "examples/${FRAMEWORK}/main.py"

      - name: Unit + ergonomics suites
        run: pytest -q

      - name: Live round-trip (opt-in)
        if: ${{ inputs.live == true }}
        env:
          # Env-var names the SDK reads were renamed MULESOFT_* -> DONKEY_* (#156);
          # the repo secret names are kept as-is so no secret re-creation is needed.
          DONKEY_LLM_PROXY_URL: ${{ secrets.MULESOFT_LLM_PROXY_URL }}
          DONKEY_LLM_PROXY_CLIENT_ID: ${{ secrets.MULESOFT_LLM_PROXY_CLIENT_ID }}
          DONKEY_LLM_PROXY_CLIENT_SECRET: ${{ secrets.MULESOFT_LLM_PROXY_CLIENT_SECRET }}
        run: python scripts/verify_frameworks.py --only "${FRAMEWORK}" --live --emit-verified
