# Nightly framework matrix (§8.4, BG §1.8).
#
# Purpose: two different nightly checks, in two different jobs below.
#
#   `matrix`         — catches upstream framework churn for the
#                       CONFORMANCE-TESTED adapter(s) (today: LangGraph only).
#   `framework-legs`  — catches upstream churn for EVERY ADAPTERS entry via a
#                       fresh, unconstrained resolve (#748; see that job's own
#                       comment for why it exists alongside ci.yml's
#                       constraint-locked `adapter-contract` legs).
#
# `matrix` scope (#197): the roster is "one deep, seven shallow" — only
# LangGraph is conformance-tested, so it is the only framework in `matrix`
# (which re-verifies §8 class/kwarg signatures against the newest upstream
# release). The other seven are supported at connection_kwargs() only; their
# governed-kwargs shape is guarded by the blocking unit suite
# (tests/unit/test_adapter_ergonomics.py) and, since #748, by their own
# `framework-legs` entry below. Native-constructor signatures can also be
# checked on demand with `python scripts/verify_frameworks.py` (FRAMEWORKS
# there stays the full roster). A demoted framework rejoins `matrix` when
# demand promotes it to deep support (#223/#244).
#
# What `matrix` runs per framework:
#   1. verify_frameworks.py --only <fw>  — signature check (offline). Fails the job
#      if an INSTALLED framework's class/kwarg signature no longer matches §8.
#   2. examples/<fw>/main.py             — smoke: must exit 0 with no creds set
#      (the LangGraph example runs against the in-process local simulator).
#   3. pytest                            — the unit + ergonomics suites.
#
# NOTE (known constraint): the extras carry no `openai` upper bound ("floors,
# never ceilings"). OpenAI 3.x retyped its injected client to vendored httpx2,
# but runtime injection is re-verified and test-pinned; see
# docs/verified-apis.md §8.1.
#
# Live verification (a real proxy round-trip) is intentionally NOT in the nightly
# run: it needs sandbox credentials. Trigger it manually via workflow_dispatch
# with `live: true` and the MULESOFT_LLM_PROXY_* repo secrets configured.
#
# Security: matrix values and inputs are passed into steps via `env:` and
# referenced as shell variables (never interpolated directly into run: bodies),
# per the GitHub Actions injection-hardening guidance.

name: nightly-framework-matrix

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      live:
        description: "Run a live proxy round-trip (requires MULESOFT_LLM_PROXY_* secrets)"
        type: boolean
        default: false

# Least privilege: the matrix only reads the checkout, never writes back.
permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  # Base gates on the framework-free core — must pass regardless of any framework.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (dev + llm, no framework)
        run: python -m pip install --upgrade pip && pip install -e ".[llm,cli]" --group dev
      - run: ruff check .
      - run: mypy
      - run: lint-imports
      - run: pytest -q

  # `[all]` must stay installable as upstream releases land (#697). No floor can
  # stop an upstream release from breaking the resolve, so re-check it nightly
  # against the newest releases; ci.yml runs the same check per PR.
  all-extra-resolves:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: pip resolves donkey-kit[all]
        run: timeout 300 pip install --dry-run ".[all]"

  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Don't let one framework's upstream break cancel the others — we want the
    # full per-framework signal every night.
    strategy:
      fail-fast: false
      matrix:
        # The conformance-tested roster (BG §1.8, #197): only LangGraph. Every
        # key MUST have a matching pyproject extra AND an examples/<key>/main.py;
        # the "reject unwired framework" guard step below fails fast (with a clear
        # message) if a stray key is added, so the list can't silently drift into
        # permanently-red jobs again (#140). To promote another framework to deep
        # support (#223/#244), add its key here AND flip conformance_tested=True in
        # the ADAPTERS registry. The other seven frameworks are supported at
        # connection_kwargs() only, guarded by the blocking unit suite, and already
        # get a real install + real import/build on every PR via ci.yml (#748) —
        # they are absent from this nightly matrix because it checks something they
        # don't need (upstream §8 signature drift for the deep adapter), not because
        # they lack real-install coverage. `donkey.openai()` is a separate raw-client
        # method (#277).
        framework:
          - langgraph
    name: verify (${{ matrix.framework }})
    env:
      # Bind the matrix value to an env var so it is never interpolated into a
      # run: body directly (injection hardening).
      FRAMEWORK: ${{ matrix.framework }}
      RUN_LIVE: ${{ inputs.live }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Fail fast and loud if the matrix names a framework that isn't actually
      # wired (no examples/<fw>/main.py) — a stray entry would otherwise die with
      # a cryptic `pip install` exit 2 and read as an upstream break (#140).
      - name: Reject unwired framework (matrix drift guard)
        run: |
          if [ ! -f "examples/${FRAMEWORK}/main.py" ]; then
            echo "::error::'${FRAMEWORK}' has no examples/${FRAMEWORK}/main.py — not a wired framework. The matrix list must match the supported set (source of truth: scripts/verify_frameworks.py FRAMEWORKS + pyproject extras + examples/)."
            exit 1
          fi

      # `local` + `otel` match ci.yml's langgraph-demo: the example smoke boots the
      # simulator (uvicorn, from `local`) and flushes spans (opentelemetry, from
      # `otel`). Without them the smoke step dies on ModuleNotFoundError and the
      # unit suites never run (#834).
      - name: Install SDK + framework extra
        run: python -m pip install --upgrade pip && pip install -e ".[llm,${FRAMEWORK},local,otel]" --group dev

      - name: Signature verification (§8)
        run: python scripts/verify_frameworks.py --only "${FRAMEWORK}"

      - name: Example smoke (must exit 0 without creds)
        run: python "examples/${FRAMEWORK}/main.py"

      - name: Unit + ergonomics suites
        run: pytest -q

      - name: Live round-trip (opt-in)
        if: ${{ inputs.live == true }}
        env:
          # Env-var names the SDK reads were renamed MULESOFT_* -> DONKEY_* (#156);
          # the repo secret names are kept as-is so no secret re-creation is needed.
          DONKEY_LLM_PROXY_URL: ${{ secrets.MULESOFT_LLM_PROXY_URL }}
          DONKEY_LLM_PROXY_CLIENT_ID: ${{ secrets.MULESOFT_LLM_PROXY_CLIENT_ID }}
          DONKEY_LLM_PROXY_CLIENT_SECRET: ${{ secrets.MULESOFT_LLM_PROXY_CLIENT_SECRET }}
        run: python scripts/verify_frameworks.py --only "${FRAMEWORK}" --live --emit-verified

  framework-legs:
    # #748 Step 2: one leg per `donkey_kit.integrations.ADAPTERS` key — not just
    # the conformance-tested set `matrix` above covers. ci.yml's PR-gating
    # `adapter-contract` matrix already installs each of these frameworks for
    # real, but with `-c constraints/adapter-contract-<extra>-py3.12.txt`
    # (ADR 0007 rule 3): a PR's result must not change because of what upstream
    # released that day. This job is the deliberate opposite: a FRESH,
    # unconstrained resolve of each framework's own extra, so an upstream
    # release that breaks a framework is caught here, overnight, before it ever
    # reaches a PR (ADR 0007 rule 4 — this job is one of the fresh-resolve
    # canaries that rule names).
    #
    # `extra` is listed explicitly alongside `framework` because they are NOT
    # always the same string: `donkey_kit.integrations.ADAPTERS["openai_agents"]`
    # (the key verify_frameworks.py and DONKEY_CONTRACT_EXTRA's skip-guard use)
    # has `.extra == "openai-agents"` (the pyproject/pip extra, hyphenated) — a
    # gap a previous reviewer flagged (#748). `test_nightly_framework_legs_
    # match_adapters` (tests/unit/test_adapter_roster.py) asserts this list is
    # exactly ADAPTERS, pair for pair, so a new or renamed adapter can't drift
    # out of sync here silently.
    #
    # What runs per leg:
    #   1. pip install, no `-c` (fresh resolve, see above).
    #   2. verify_frameworks.py --only <framework> --require-installed —
    #      signature check, and fail (not exit 0) if the install silently did
    #      not actually provide the framework (#748 reviewer note).
    #   3. The WHOLE suite, DONKEY_CONTRACT_EXTRA set to this leg's extra, so
    #      tests/conftest.py's skip guard turns an unexpected
    #      importorskip(this framework) into a failure rather than a silent skip.
    #   4. scripts/smoke_example.py <fw>: build examples/<fw>/main.py's native
    #      object (non-zero on ImportError) and drive it through the conformance
    #      kit (governed calls, in-process) rather than printing install guidance
    #      and exiting 0.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: langgraph
            extra: langgraph
          - framework: adk
            extra: adk
          - framework: strands
            extra: strands
          - framework: agent_framework
            extra: agent_framework
          - framework: openai_agents
            extra: openai-agents
          - framework: anthropic
            extra: anthropic
          - framework: crewai
            extra: crewai
          - framework: llamaindex
            extra: llamaindex
    name: framework-legs (${{ matrix.framework }})
    env:
      # Bind matrix values to env vars so they are never interpolated directly
      # into a run: body (injection hardening).
      FRAMEWORK: ${{ matrix.framework }}
      EXTRA: ${{ matrix.extra }}
      # tests/conftest.py reads this (the PIP EXTRA name, not the FRAMEWORKS
      # key) to decide which importorskip calls must fail instead of skip.
      DONKEY_CONTRACT_EXTRA: ${{ matrix.extra }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # `local` + `otel`: so the whole-suite step's simulator (uvicorn) and span
      # tests run rather than skip. No `-c`: a fresh resolve is this job's whole point.
      - name: Install SDK + framework extra (fresh resolve; ADR 0007 rule 4)
        run: >-
          python -m pip install --upgrade pip &&
          pip install -e ".[llm,local,otel,$EXTRA]" --group dev

      - name: Signature verification (§8), fail if not actually installed (#748)
        run: python scripts/verify_frameworks.py --only "$FRAMEWORK" --require-installed

      - name: Whole suite, this leg's framework real, skip guard armed (#748)
        run: python -m pytest -q

      - name: Strict example smoke (non-zero on a missing framework; governed calls via the conformance kit)
        run: timeout 120 python scripts/smoke_example.py "$FRAMEWORK"
