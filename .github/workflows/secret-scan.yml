name: Secret scan

# #819: gitleaks over the full history on every PR and on pushes to the long-lived
# branches. Same config (.gitleaks.toml) as the local pre-commit hook. GitHub
# secret scanning with push protection is also on for this repository; this job
# adds the generic rules push protection does not cover.

on:
  push:
    branches: [main, develop]
  pull_request:

# Least privilege: this workflow only reads the checkout, never writes back.
permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from the release's checksums.txt
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so a secret added and then deleted within a PR is still caught.
          fetch-depth: 0
      # The binary, not gitleaks-action: the action needs a paid licence for
      # organisation repositories.
      - name: install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: scan history
        run: gitleaks git --no-banner --redact --verbose .
