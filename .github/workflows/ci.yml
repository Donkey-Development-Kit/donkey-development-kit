name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the checkout, never writes back.
permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  base-only:
    # Working instruction #9: install ONLY the base package and run the base
    # suite to catch accidental top-level framework imports. The installed-wheel
    # check runs afterward in its own environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e . --group dev
      - name: import donkey_kit with no framework extras installed
        run: python -c "import donkey_kit; from donkey_kit import Donkey; print(donkey_kit.__version__)"
      - run: pytest -q tests/unit
      - name: installed wheel resolves packaged simulator fixtures (BG §1.4)
        run: |
          wheel_dir="$(mktemp -d)"
          venv_dir="$(mktemp -d)"
          trap 'rm -rf "$wheel_dir" "$venv_dir"' EXIT
          pip install build
          python -m build --wheel --outdir "$wheel_dir"
          set -- "$wheel_dir"/*.whl
          test "$#" -eq 1
          # #821: the wheel ships fixtures; none may carry a tenant identifier.
          python scripts/scrub_fixtures.py --check "$1"
          python -m venv "$venv_dir"
          "$venv_dir/bin/pip" install "$1"
          "$venv_dir/bin/python" - <<'PY'
          from donkey_kit.simulator import fixtures

          # Prove load() reads the wheel's package data, not a checkout (#746).
          assert "site-packages" in fixtures.LOCK_PATH.parts, fixtures.LOCK_PATH
          for shape in fixtures.SHAPES:
              fixtures.load(shape)
          assert fixtures.LOCK_PATH.exists(), fixtures.LOCK_PATH
          assert fixtures.compute_manifest() == fixtures.read_lock()
          before = fixtures.LOCK_PATH.read_bytes()
          fixtures.write_lock()
          assert fixtures.LOCK_PATH.read_bytes() == before
          PY

  all-extra-resolves:
    # #697: `[all]` once bundled framework extras that are not co-installable
    # upstream, and no job ever resolved it, so `pip install "donkey-kit[all]"`
    # shipped broken (resolution-too-deep). Dry-run it with a current pip on every
    # supported Python; `timeout` turns a resolver that backtracks for minutes
    # into a failure instead of a hung job. The nightly matrix repeats this to
    # catch upstream releases between PRs.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: pip resolves donkey-kit[all]
        run: timeout 300 pip install --dry-run ".[all]"

  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e ".[llm,cli]" --group dev
      - name: mypy --strict (blocking, working instruction #8)
        run: mypy
      # #721: the examples are user-facing code, so they get the same --strict
      # config, one directory per invocation (each is its own program). The
      # framework extras are absent here, so their imports resolve through the
      # absence-only overrides in pyproject.toml. LangGraph is the exception: it
      # is not in those overrides and is checked against the real package in the
      # langgraph-demo job below.
      - name: mypy --strict over python/examples (#721)
        run: |
          for dir in examples/*/; do
            name="$(basename "$dir")"
            if [ "$name" = langgraph ]; then continue; fi
            echo "mypy -p examples.$name"
            mypy -p "examples.$name"
          done
      - run: ruff check .
      - name: import-linter (framework-free core, §1.1)
        run: lint-imports
      - name: no verification-status claims in src/ outside core/_verify.py (#718)
        run: python scripts/check_verification_claims.py
      - name: no doc links to untracked paths, no committed plan files (#785)
        run: python scripts/check_doc_links.py
      - name: no tenant identifiers or live platform hosts in tracked files (#821)
        run: python scripts/scrub_fixtures.py --check
      - name: no dead code in src/ (vulture, whitelist in vulture_whitelist.py, #720)
        run: vulture

  new-dependencies:
    # #936: a direct dependency new to this PR must exist on PyPI, so a
    # hallucinated or typosquatted name fails here instead of at install time.
    # The allowlist itself is checked offline by test_house_style_config.py;
    # this job adds the network check a unit test cannot make. The script is
    # stdlib-only and exits early when no name is new, so it needs no install
    # and no path filter.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Bind the base ref to an env var so it is never interpolated into a
      # run: body directly (injection hardening).
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: fetch the base branch's pyproject.toml
        # A base without python/pyproject.toml counts as declaring nothing.
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git show "FETCH_HEAD:python/pyproject.toml" > "$RUNNER_TEMP/base-pyproject.toml" || true
      - name: new direct dependencies exist on PyPI (#936)
        run: python scripts/check_new_dependencies.py --base "$RUNNER_TEMP/base-pyproject.toml"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # [local] here (and only here) so the simulator's ASGI tests execute; the
      # base-only and typecheck jobs deliberately omit it (importorskip guards
      # skip the ASGI tests there, proving import donkey_kit.simulator stays
      # green without starlette/uvicorn). [otel] likewise: the GenAI-span
      # assertions (BG §1.6, #192) importorskip opentelemetry.sdk, so they only
      # actually execute in this job — the typecheck job stays [llm,cli] and
      # relies on the absence-only opentelemetry mypy override.
      - run: python -m pip install --upgrade pip && pip install -e ".[llm,cli,local,otel]" --group dev
      - run: pytest -q
      # The local gateway simulator's out-of-process boot (BG §1.4) is
      # local_gateway-marked and deselected from the default run above. It is
      # pure-Python (no docker), so run it explicitly here where [local] is
      # installed — the one marker path that is now safe in CI (sandbox stays
      # off, needing real Anypoint creds).
      - name: local gateway simulator boot (BG §1.4)
        run: pytest -q -m local_gateway
      # #801: the offline seams (simulate(), the conformance harness) must stay
      # offline behind a corporate proxy. Every proxy variable points at a dead
      # port, so a request that escapes the swapped-in fixture fails the run.
      - name: offline seams stay offline under HTTP(S)_PROXY (#801)
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: >-
          pytest -q tests/unit/test_simulate.py tests/unit/test_conformance.py
          tests/unit/test_conformance_plugin.py tests/unit/test_transport_proxy_mounts.py

  anthropic-stacks:
    # #701: anthropic>=1.0 is built on httpx2 and rejects the shared httpx client,
    # so donkey.anthropic hands it a bridged httpx2 client instead, while
    # anthropic<1 still gets the shared client itself. No other job installs
    # anthropic, so its tests run on both majors here. The `<1` pin tests the
    # older major only; the extra keeps its floor and no ceiling (§8.4).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        anthropic: ["anthropic>=1", "anthropic<1"]
    name: anthropic-stacks (${{ matrix.anthropic }})
    env:
      # Bind the matrix value to an env var so it is never interpolated into a
      # run: body directly (injection hardening).
      ANTHROPIC_SPEC: ${{ matrix.anthropic }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[llm,anthropic]" --group dev "$ANTHROPIC_SPEC"
      - run: >-
          pytest -q
          tests/unit/test_anthropic_client_stacks.py
          tests/unit/test_anthropic_httpx2_bridge.py
          tests/unit/test_adapter_ergonomics.py
          tests/unit/test_adapter_async_last_call.py
          tests/unit/test_default_runtime.py
          tests/unit/test_shared_client_views.py

  adk-stacks:
    # #735: below google-adk 2.4, Gemini silently drops client_kwargs and
    # donkey.adk.gemini() would bypass the gateway; it now refuses instead. No
    # other job installs google-adk, so the real-ADK round-trip and redirect
    # tests run here, at the extra's floor and at the newest release. The `==`
    # pin tests the floor only; the extra keeps no ceiling (§8.4).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adk: ["google-adk>=2.4", "google-adk==2.4.0"]
    name: adk-stacks (${{ matrix.adk }})
    env:
      # Bind the matrix value to an env var so it is never interpolated into a
      # run: body directly (injection hardening).
      ADK_SPEC: ${{ matrix.adk }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[llm,adk]" --group dev "$ADK_SPEC"
      - run: >-
          pytest -q
          tests/unit/test_adapter_ergonomics.py
          tests/unit/test_framework_redirects.py
          tests/unit/test_adapter_async_last_call.py
          tests/unit/test_transport_injection.py

  agent-framework-middleware:
    # #739: policy_middleware() is only meaningful on a real Agent Framework
    # Agent, which no other job installs. Run its tests with the extra present,
    # with the shared-client correlation and last_call tests (#740).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[llm,agent_framework]" --group dev
      - run: >-
          pytest -q
          tests/unit/test_agent_framework_policy_middleware.py
          tests/unit/test_adapter_ergonomics.py
          tests/unit/test_transport_injection.py

  llamaindex-transport:
    # #740: LlamaIndex sends through the shared client, so its calls carry the
    # run's correlation id, populate donkey.last_call and refuse as typed errors
    # through typed_refusals(). No other job installs it, so run those tests here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[llm,llamaindex]" --group dev
      - run: >-
          pytest -q
          tests/unit/test_transport_injection.py
          tests/unit/test_adapter_ergonomics.py

  agents-strands-last-call:
    # #899: the OpenAI Agents SDK and Strands send through the shared client, but
    # no other job installs them, so their donkey.last_call tests would only
    # skip. Run them with both extras present.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[llm,openai-agents,strands]" --group dev
      - run: >-
          pytest -q
          tests/unit/test_adapter_async_last_call.py
          tests/unit/test_adapter_ergonomics.py

  benchmark:
    # BG §1.6 / #194 AC #3: the GenAI span adds < 1 ms per governed call. The
    # `benchmark`-marked test is deselected from the default run (addopts), so it
    # runs here as its own blocking gate — a regression that makes span
    # instrumentation expensive fails the build. `[otel]` for the real SDK
    # TracerProvider it measures against; `-s` so the measured µs/call is visible
    # in the job log even on a pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e ".[llm,cli,local,otel]" --group dev
      - name: GenAI span overhead < 1ms/call (BG §1.6, #194)
        run: pytest -q -m benchmark -s

  quickstart:
    # #203 / BG §1.4: the gateway-free 15-minute quickstart, executed on a clean
    # runner so the documented first-run experience can never silently rot. No
    # Anypoint credentials and no real gateway — examples/quickstart/main.py
    # boots the local simulator in-process, so this proves `pip install` →
    # typed refusal works end to end with nothing but the published extras.
    # The example is the exact code the docs quickstart shows; keeping it in CI
    # is what stops the two from drifting. `timeout` bounds wall-clock so a hang
    # or a slow regression fails rather than blocking.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[llm,local,otel]"
      - name: run the gateway-free quickstart (must exit 0, no credentials)
        run: timeout 120 python examples/quickstart/main.py

  langgraph-demo:
    # #199 / BG §1.8: the Phase-1 acceptance artefact — Scenario A end to end
    # against the simulator only. examples/langgraph/main.py triages five support
    # tickets through a real two-node LangGraph graph, blocks the PII-laden one as
    # a typed PIIDetected (the pii_block:every=5 scenario), and exports every
    # call's span to a bundled local OTLP collector (zero-config export, #194).
    # Timed on a clean runner (no credentials, no gateway) so the demo can never
    # silently rot, and the same build() factory is re-run through the
    # customer-facing conformance plugin — the exact `--donkey-conformance`
    # invocation a team runs against its own agent. The dev group for pytest + the
    # conformance plugin entry point.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e ".[llm,langgraph,local,otel]" --group dev
      - name: mypy --strict over the LangGraph example, langgraph installed (#721)
        run: mypy -p examples.langgraph
      - name: run the gateway-free Scenario-A demo (must exit 0, no credentials)
        run: timeout 120 python -m examples.langgraph.main
      - name: conformance passes against the demo's own agent factory
        # `python -m pytest` (not the bare `pytest` console script) so the
        # working directory (python/) lands on sys.path — that's what makes the
        # `examples` namespace package importable for --donkey-agent=examples.langgraph.
        # main:build. The bare script omits cwd from sys.path and fails to import.
        run: python -m pytest -q --donkey-conformance --donkey-agent=examples.langgraph.main:build

  # Nightly framework matrix (§8.4) — runs the conformance kit against the
  # LATEST release of each framework and opens an issue on failure. Scheduled
  # separately during Phase 1 and later.

  docs-llms-drift:
    # #205 / BG §1.10: llms.txt, llms-full.txt, and the per-page .md files are
    # generated from the Nextra pages (ordering + titles from _meta.js, content
    # from each .mdx + its frontmatter — the single source of truth). Regenerate
    # here and fail on any diff, lockfile-style, so the committed copies can
    # never drift from the pages. The generator uses only Node built-ins, so no
    # npm install is needed.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Unit-test the analytics beacon gate and the reader-facing link ref
        run: npm test
      - run: node scripts/generate-llms.mjs
      - name: Fail if the generated llms artifacts are stale
        run: |
          if [ -n "$(git status --porcelain public)" ]; then
            echo "::error::llms artifacts are out of date. Run 'npm run generate:llms' in website/ and commit the result."
            git status --porcelain public
            git --no-pager diff -- public
            exit 1
          fi
          echo "llms artifacts are up to date."
