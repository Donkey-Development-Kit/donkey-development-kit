# ADR 0007 rule 3 (docs/adr/0007-dependency-policy.md, #948): PR-gating jobs
# below install with `-c python/constraints/<combo>-py3.NN.txt` so a PR's
# result doesn't change because of what an upstream package released that
# day — only because of what the PR itself changed. One constraints file per
# job's own exact extras/dev-group/python combo, NEVER a file merged across
# combos: `openai-agents`, `google-adk`, `crewai` and `llama-index-llms-openai`
# all put ceilings on packages (`websockets`, `regex`, `openai`) that other
# combos resolve past, so a merged file is unsatisfiable for those jobs (see
# scripts/compile_constraints.py's module docstring). The jobs whose purpose
# IS a fresh resolve (`all-extra-resolves`, `anthropic-stacks`, `adk-stacks`,
# and everything in nightly-matrix.yml) deliberately keep resolving fresh —
# they are the canary ADR 0007 rule 4 relies on. Refresh the lock with
# `python scripts/compile_constraints.py` (see CONTRIBUTING.md); keep
# `scripts/compile_constraints.py`'s `_COMBOS` in sync with the jobs below —
# each entry's `extras`/`dev_group` must match that job's install line exactly.
name: CI

# #755: `develop` too, so two individually green PRs that combine into a broken
# `develop` fail at merge time instead of at promotion to `main`. No
# `merge_group:` trigger: the repo has no merge queue.
on:
  push:
    branches: [main, develop]
  pull_request:

# Least privilege: this workflow only reads the checkout, never writes back.
permissions:
  contents: read

# #761: a new push to a PR supersedes its previous run, so cancel that run
# instead of finishing all of its jobs. Pushes to a branch are never cancelled:
# every merge commit there gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# #1005: pip caches are restored on every run but saved only by pushes to
# main/develop (the `actions/cache/save` step after each install, guarded on
# github.event_name). A PR's own cache is scoped to refs/pull/<N>/merge, so no
# other PR could read it; PRs restore what develop saved instead. The key is
# pip-<os>-py<minor>-<job>-<hash of the job's constraints file> (pyproject.toml
# for the fresh-resolve jobs): the minor, not the patch, so runners on
# different patches of one minor share an entry (#1004). It holds downloaded
# wheels only, so a fresh-resolve job still resolves against the index.
defaults:
  run:
    working-directory: python

# #765: each job's checks are the python/noxfile.py session of the same name, so
# `nox -s <job>` runs locally exactly what the job runs here (CONTRIBUTING.md,
# "The pre-PR gate"). The job installs into the runner's Python, where its lock
# and cache steps live, then runs that session in place: --no-venv uses the
# job's Python, --no-install skips the session's own installs. pipx keeps nox
# and its dependencies out of the job's environment. Change a check in the
# session, not here; tests/unit/test_noxfile.py keeps the two in step.
env:
  NOX_VERSION: "2026.8.17"

jobs:
  base-only:
    # Working instruction #9: install ONLY the base package and run the base
    # suite to catch accidental top-level framework imports. The installed-wheel
    # check runs afterward in its own environment.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - id: pip-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ github.job }}-${{ hashFiles('python/constraints/base-only-py3.11.txt') }}
          restore-keys: pip-${{ runner.os }}-py3.11-${{ github.job }}-
      # -c locks the resolve so an upstream release can't turn this job red on
      # its own (ADR 0007 rule 3, #948); refresh with scripts/compile_constraints.py.
      - run: python -m pip install --upgrade pip && pip install -e . --group dev -c constraints/base-only-py3.11.txt
      - if: github.event_name == 'push' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}
      - name: base import, no pydantic (#730), tests/unit, installed-wheel fixtures (BG §1.4)
        run: pipx run --spec "nox==$NOX_VERSION" nox --no-venv --no-install -s base-only

  all-extra-resolves:
    # #697: `[all]` once bundled framework extras that are not co-installable
    # upstream, and no job ever resolved it, so `pip install "donkey-kit[all]"`
    # shipped broken (resolution-too-deep). Dry-run it with a current pip on every
    # supported Python; `timeout` turns a resolver that backtracks for minutes
    # into a failure instead of a hung job. The nightly matrix repeats this to
    # catch upstream releases between PRs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - id: pip-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.job }}-${{ hashFiles('python/pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.job }}-
      - run: python -m pip install --upgrade pip
      - name: pip resolves donkey-kit[all]
        run: pipx run --spec "nox==$NOX_VERSION" nox --no-venv --no-install -s all-extra-resolves
      - if: github.event_name == 'push' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}

  typecheck-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - id: pip-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ github.job }}-${{ hashFiles('python/constraints/typecheck-and-lint-py3.11.txt') }}
          restore-keys: pip-${{ runner.os }}-py3.11-${{ github.job }}-
      # -c locks the resolve (ADR 0007 rule 3, #948); refresh with scripts/compile_constraints.py.
      - run: python -m pip install --upgrade pip && pip install -e ".[llm,cli]" --group dev -c constraints/typecheck-and-lint-py3.11.txt
      - if: github.event_name == 'push' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}
      # mypy --strict (working instruction #8) and over each python/examples
      # package but LangGraph (#721, checked in langgraph-demo), ruff check and
      # ruff format --check (#765), import-linter (§1.1), the verification-claims
      # (#718), doc-link (#785) and fixture-scrub (#821) scripts, and vulture (#720).
      - name: types, lint, format, import contracts, repo checks, dead code
        run: pipx run --spec "nox==$NOX_VERSION" nox --no-venv --no-install -s typecheck-and-lint

  new-dependencies:
    # #936: a direct dependency new to this PR must exist on PyPI, so a
    # hallucinated or typosquatted name fails here instead of at install time.
    # The allowlist itself is checked offline by test_house_style_config.py;
    # this job adds the network check a unit test cannot make. The script is
    # stdlib-only and exits early when no name is new, so it needs no install
    # and no path filter.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Bind the base ref to an env var so it is never interpolated into a
      # run: body directly (injection hardening).
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: fetch the base branch's pyproject.toml
        # A base without python/pyproject.toml counts as declaring nothing.
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git show "FETCH_HEAD:python/pyproject.toml" > "$RUNNER_TEMP/base-pyproject.toml" || true
      - name: new direct dependencies exist on PyPI (#936)
        run: pipx run --spec "nox==$NOX_VERSION" nox --no-venv --no-install -s new-dependencies -- --base "$RUNNER_TEMP/base-pyproject.toml"

  commit-identities:
    # #1048: a squash merge turns every PR-commit author into a Co-authored-by
    # trailer on develop, and GitHub credits whoever claimed that email. A
    # placeholder like `x <x@x>` credited an unrelated account and could only be
    # removed by rewriting develop, so it fails here, before the merge. The
    # script is stdlib-only and needs no install.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Bind the SHAs to env vars so they are never interpolated into a run:
      # body directly (injection hardening).
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so BASE_SHA..HEAD_SHA resolves.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: no placeholder git identities in the PR's commits (#1048)
        run: pipx run --spec "nox==$NOX_VERSION" nox --no-venv --no-install -s commit-identities -- "$BASE_SHA..$HEAD_SHA"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # #761: one failing Python version must not cancel the others; the matrix
      # exists to show which versions fail.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # Bind the matrix value to an env var so it is never interpolated into a
      # run: body directly (injection hardening); also names this job's lock.
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - id: pip-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.job }}-${{ hashFiles(format('python/constraints/test-py{0}.txt', matrix.python-version)) }}
          restore-keys: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.job }}-
      # [local] here (and only here) so the simulator's ASGI tests execute; the
      # base-only and typecheck jobs deliberately omit it (importorskip guards
      # skip the ASGI tests there, proving import donkey_kit.simulator stays
      # green without starlette/uvicorn). [otel] likewise: the GenAI-span
      # assertions (BG §1.6, #192) importorskip opentelemetry.sdk, so they only
      # actually execute in this job — the typecheck job stays [llm,cli] and
      # relies on the absence-only opentelemetry mypy override.
      # -c locks the resolve per Python version (ADR 0007 rule 3, #948);
      # refresh with scripts/compile_constraints.py (combo "test").
      - run: >-
          python -m pip install --upgrade pip &&
          pip install -e ".[llm,cli,local,otel]" --group dev -c "constraints/test-py${PYTHON_VERSION}.txt"
      - if: github.event_name == 'push' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}
      # The default suite, the local gateway simulator's boot (BG §1.4), the
      # offline seams under a dead HTTP(S)_PROXY (#801), the default suite again
      # under a dead proxy and OTLP collector (#747), and on the 3.11 leg only,
      # branch coverage (#751) with its report in the job summary and its floor
      # (`fail_under`, pyproject.toml). Under --no-venv the session is named
      # `test` and reads the leg's version from the interpreter.
      - name: suites, offline seams, coverage on 3.11 (nox -s test)
        run: pipx run --spec "nox==$NOX_VERSION" nox --no-venv --no-install -s test

  anthropic-stacks:
    # #701: anthropic>=1.0 is built on httpx2 and rejects the shared httpx client,
    # so donkey.anthropic hands it a bridged httpx2 client instead, while
    # anthropic<1 still gets the shared client itself. No other job installs
    # anthropic, so its tests run on both majors here. The `<1` pin tests the
    # older major only; the extra keeps its floor and no ceiling (§8.4). The
    # typed-refusal bridge case for the Anthropic client runs here too (#983).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        anthropic: ["anthropic>=1", "anthropic<1"]
    name: anthropic-stacks (${{ matrix.anthropic }})
    env:
      # Bind the matrix value to an env var so it is never interpolated into a
      # run: body directly (injection hardening).
      ANTHROPIC_SPEC: ${{ matrix.anthropic }}
      # #748: this job installs anthropic for real, so an
      # unexpected `pytest.importorskip("anthropic")` elsewhere must fail here,
      # not silently skip (see tests/conftest.py).
      DONKEY_CONTRACT_EXTRA: anthropic
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: pip-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ github.job }}-${{ hashFiles('python/pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-py3.12-${{ github.job }}-
      - run: python -m pip install --upgrade pip && pip install -e ".[llm,anthropic]" --group dev "$ANTHROPIC_SPEC"
      - if: github.event_name == 'push' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}
      - run: pipx run --spec "nox==$NOX_VERSION" nox --no-venv --no-install -s "anthropic-stacks($ANTHROPIC_SPEC)"

  adk-stacks:
    # #735: below google-adk 2.4, Gemini silently drops client_kwargs and
    # donkey.adk.gemini() would bypass the gateway; it now refuses instead. No
    # other job installs google-adk, so the real-ADK round-trip and redirect
    # tests run here, at the extra's floor and at the newest release, with the
    # typed-refusal bridge case for adk.gemini() (#955). The `==` pin tests the
    # floor only; the extra keeps no ceiling (§8.4).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        adk: ["google-adk>=2.4", "google-adk==2.4.0"]
    name: adk-stacks (${{ matrix.adk }})
    env:
      # Bind the matrix value to an env var so it is never interpolated into a
      # run: body directly (injection hardening).
      ADK_SPEC: ${{ matrix.adk }}
      # #748: this job installs google-adk for real, so an
      # unexpected `pytest.importorskip` on it elsewhere must fail here, not
      # silently skip (see tests/conftest.py).
      DONKEY_CONTRACT_EXTRA: adk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: pip-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ github.job }}-${{ hashFiles('python/pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-py3.12-${{ github.job }}-
      - run: python -m pip install --upgrade pip && pip install -e ".[llm,adk]" --group dev "$ADK_SPEC"
      - if: github.event_name == 'push' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}
      - run: pipx run --spec "nox==$NOX_VERSION" nox --no-venv --no-install -s "adk-stacks($ADK_SPEC)"

  agent-framework-middleware:
    # #739: policy_middleware() is only meaningful on a real Agent Framework
    # Agent, which no other job installs. Run its tests with the extra present,
    # with the shared-client correlation and last_call tests (#740) and the
    # typed-refusal bridge case for an Agent Framework Agent run (#983).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # #748: this job installs agent_framework for real, so an
      # unexpected `pytest.importorskip` on it elsewhere must fail here, not
      # silently skip (see tests/conftest.py).
      DONKEY_CONTRACT_EXTRA: agent_framework
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: pip-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ github.job }}-${{ hashFiles('python/constraints/agent-framework-middleware-py3.12.txt') }}
          restore-keys: pip-${{ runner.os }}-py3.12-${{ github.job }}-
      # -c locks the resolve (ADR 0007 rule 3, #948); refresh with scripts/compile_constraints.py.
      - run: python -m pip install --upgrade pip && pip install -e ".[llm,agent_framework]" --group dev -c constraints/agent-framework-middleware-py3.12.txt
      - if: github.event_name == 'push' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}
      - run: pipx run --spec "nox==$NOX_VERSION" nox --no-venv --no-install -s agent-framework-middleware

  llamaindex-transport:
    # #740: LlamaIndex sends through the shared client, so its calls carry the
    # run's correlation id, populate donkey.last_call and refuse as typed errors
    # through typed_refusals(). No other job installs it, so run those tests here,
    # with the typed-refusal bridge case for a FunctionAgent run (#955).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # #748: this job installs llamaindex for real, so an
      # unexpected `pytest.importorskip` on it elsewhere must fail here, not
      # silently skip (see tests/conftest.py).
      DONKEY_CONTRACT_EXTRA: llamaindex
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: pip-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ github.job }}-${{ hashFiles('python/constraints/llamaindex-transport-py3.12.txt') }}
          restore-keys: pip-${{ runner.os }}-py3.12-${{ github.job }}-
      # -c locks the resolve (ADR 0007 rule 3, #948); refresh with scripts/compile_constraints.py.
      - run: python -m pip install --upgrade pip && pip install -e ".[llm,llamaindex]" --group dev -c constraints/llamaindex-transport-py3.12.txt
      - if: github.event_name == 'push' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}
      - run: pipx run --spec "nox==$NOX_VERSION" nox --no-venv --no-install -s llamaindex-transport

  agents-strands-last-call:
    # #899: the OpenAI Agents SDK and Strands send through the shared client, but
    # no other job installs them, so their donkey.last_call tests would only
    # skip. Run them with both extras present, with the typed-refusal bridge cases
    # for an Agents SDK Runner run (#955) and a Strands Agent run (#983).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # #748: this job installs both frameworks for real, so an unexpected
      # `pytest.importorskip` on either must fail here, not silently skip (see
      # tests/conftest.py; a comma-separated list is how one job owns two).
      DONKEY_CONTRACT_EXTRA: "openai-agents,strands"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: pip-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ github.job }}-${{ hashFiles('python/constraints/agents-strands-last-call-py3.12.txt') }}
          restore-keys: pip-${{ runner.os }}-py3.12-${{ github.job }}-
      # -c locks the resolve (ADR 0007 rule 3, #948); refresh with scripts/compile_constraints.py.
      - run: python -m pip install --upgrade pip && pip install -e ".[llm,openai-agents,strands]" --group dev -c constraints/agents-strands-last-call-py3.12.txt
      - if: github.event_name == 'push' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}
      - run: pipx run --spec "nox==$NOX_VERSION" nox --no-venv --no-install -s agents-strands-last-call

  adapter-contract:
    # #742: the adapter contract suite, one leg per ADAPTERS extra, each with its
    # real framework installed. DONKEY_CONTRACT_EXTRA turns that framework's
    # skips into failures, so a broken install cannot pass as a skip. The matrix
    # must list exactly the registry's extras: test_integration_checklist.py
    # asserts it. The example conformance check loads examples/<fw>/main.py by
    # path, so it does not depend on `python -m pytest` putting python/ on
    # sys.path (#1014: the nightly runs plain `pytest`).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        extra:
          - langgraph
          - adk
          - strands
          - agent_framework
          - openai-agents
          - anthropic
          - crewai
          - llamaindex
    name: adapter-contract (${{ matrix.extra }})
    env:
      # Bind the matrix value to an env var so it is never interpolated into a
      # run: body directly (injection hardening).
      DONKEY_CONTRACT_EXTRA: ${{ matrix.extra }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: pip-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ github.job }}-${{ hashFiles(format('python/constraints/adapter-contract-{0}-py3.12.txt', matrix.extra)) }}
          restore-keys: pip-${{ runner.os }}-py3.12-${{ github.job }}-
      # Dev tooling is the `dev` dependency group (#943), not an extra.
      # -c locks the resolve (ADR 0007 rule 3, #948), one file per matrix leg
      # (combo "adapter-contract-<extra>"); refresh with scripts/compile_constraints.py.
      - run: >-
          python -m pip install --upgrade pip &&
          pip install -e ".[llm,local,$DONKEY_CONTRACT_EXTRA]" --group dev
          -c "constraints/adapter-contract-${DONKEY_CONTRACT_EXTRA}-py3.12.txt"
      - if: github.event_name == 'push' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}
      # #748: the whole suite (`python -m pytest -q`), not a file list, so every
      # test that needs this leg's framework runs against the real install
      # instead of skipping. For LangGraph, the one deep adapter (BG §1.8), that
      # includes its refusal mapping, run correlation and conformance tests.
      # Then the strict example smoke: build the example's native object and
      # drive it through the conformance kit in-process, with no network.
      - name: whole suite and strict example smoke
        run: pipx run --spec "nox==$NOX_VERSION" nox --no-venv --no-install -s "adapter-contract($DONKEY_CONTRACT_EXTRA)"

  benchmark:
    # BG §1.6 / #194 AC #3: the GenAI span adds < 1 ms per governed call. The
    # `benchmark`-marked test is deselected from the default run (addopts), so it
    # runs here as its own blocking gate — a regression that makes span
    # instrumentation expensive fails the build. `[otel]` for the real SDK
    # TracerProvider it measures against; `-s` so the measured µs/call is visible
    # in the job log even on a pass.
    #
    # #753: the fixed 1ms budget has ~55x headroom over the ~18us/call
    # measured, so it would not catch a 10x regression on its own. Every run
    # writes the measured result to a JSON file; on a `main` push only (never
    # a PR) it is uploaded as an artifact and compared against the most recent
    # earlier successful `main` run's artifact by
    # scripts/compare_benchmark_trend.py, which fails this job on a regression
    # at or past `--alert-threshold`. No gh-pages branch, no new third-party
    # action.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Read earlier runs' artifacts (compare_benchmark_trend.py).
      actions: read
    env:
      # Job-level `env:` cannot use the `runner` context (an invalid-workflow
      # error that would stop every job in this file), so the file sits in the
      # workspace. `github.*` values are workflow-owned, not PR input.
      DONKEY_BENCHMARK_JSON: ${{ github.workspace }}/benchmark-result.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - id: pip-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ github.job }}-${{ hashFiles('python/constraints/benchmark-py3.11.txt') }}
          restore-keys: pip-${{ runner.os }}-py3.11-${{ github.job }}-
      # -c locks the resolve (ADR 0007 rule 3, #948); refresh with scripts/compile_constraints.py.
      - run: python -m pip install --upgrade pip && pip install -e ".[llm,cli,local,otel]" --group dev -c constraints/benchmark-py3.11.txt
      - if: github.event_name == 'push' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}
      - name: GenAI span overhead < 1ms/call (BG §1.6, #194)
        run: pipx run --spec "nox==$NOX_VERSION" nox --no-venv --no-install -s benchmark
      - name: Upload the benchmark result for trending (#753)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-result
          path: ${{ env.DONKEY_BENCHMARK_JSON }}
          if-no-files-found: error
          retention-days: 90
      - name: Alert on a relative regression vs. the previous main run (#753)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: >-
          python scripts/compare_benchmark_trend.py
          --current "$DONKEY_BENCHMARK_JSON"
          --repo "$REPO" --workflow ci.yml --run-id "$RUN_ID"
          --alert-threshold 2.0

  quickstart:
    # #203 / BG §1.4: the gateway-free 15-minute quickstart, executed on a clean
    # runner so the documented first-run experience can never silently rot. No
    # Anypoint credentials and no real gateway — examples/quickstart/main.py
    # boots the local simulator in-process, so this proves `pip install` →
    # typed refusal works end to end with nothing but the published extras.
    # The example is the exact code the docs quickstart shows; keeping it in CI
    # is what stops the two from drifting. `timeout` bounds wall-clock so a hang
    # or a slow regression fails rather than blocking.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - id: pip-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ github.job }}-${{ hashFiles('python/constraints/quickstart-py3.11.txt') }}
          restore-keys: pip-${{ runner.os }}-py3.11-${{ github.job }}-
      # -c locks the resolve (ADR 0007 rule 3, #948); refresh with scripts/compile_constraints.py.
      - run: pip install -e ".[llm,local,otel]" -c constraints/quickstart-py3.11.txt
      - if: github.event_name == 'push' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}
      - name: run the gateway-free quickstart (must exit 0, no credentials)
        run: pipx run --spec "nox==$NOX_VERSION" nox --no-venv --no-install -s quickstart

  langgraph-demo:
    # #199 / BG §1.8: the Phase-1 acceptance artefact — Scenario A end to end
    # against the simulator only. examples/langgraph/main.py triages five support
    # tickets through a real two-node LangGraph graph, blocks the PII-laden one as
    # a typed PIIDetected (the pii_block:every=5 scenario), and exports every
    # call's span to a bundled local OTLP collector (zero-config export, #194).
    # Timed on a clean runner (no credentials, no gateway) so the demo can never
    # silently rot, and the same build() factory is re-run through the
    # customer-facing conformance plugin — the exact `--donkey-conformance`
    # invocation a team runs against its own agent. The dev group for pytest + the
    # conformance plugin entry point.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - id: pip-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ github.job }}-${{ hashFiles('python/constraints/langgraph-demo-py3.11.txt') }}
          restore-keys: pip-${{ runner.os }}-py3.11-${{ github.job }}-
      # -c locks the resolve (ADR 0007 rule 3, #948); refresh with scripts/compile_constraints.py.
      - run: python -m pip install --upgrade pip && pip install -e ".[llm,langgraph,local,otel]" --group dev -c constraints/langgraph-demo-py3.11.txt
      - if: github.event_name == 'push' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}
      # mypy --strict over examples.langgraph with langgraph installed (#721),
      # the demo under a 120 s bound, then conformance against its build()
      # factory: the `--donkey-conformance` invocation a team runs on its agent.
      - name: typecheck, run, and conformance-test the Scenario-A demo
        run: pipx run --spec "nox==$NOX_VERSION" nox --no-venv --no-install -s langgraph-demo

  # The nightly framework matrix (§8.4) is .github/workflows/nightly-matrix.yml.
  # It resolves fresh against the newest upstream releases: `matrix` re-checks
  # LangGraph, the one conformance-tested adapter, against §8 signatures, and
  # `framework-legs` runs every ADAPTERS entry (#748). A red run opens or
  # updates one `nightly-failure` tracking issue (#755).

  docs-llms-drift:
    # #205 / BG §1.10: llms.txt, llms-full.txt, and the per-page .md files are
    # generated from the Nextra pages (ordering + titles from _meta.js, content
    # from each .mdx + its frontmatter — the single source of truth). Regenerate
    # here and fail on any diff, lockfile-style, so the committed copies can
    # never drift from the pages. The generator uses only Node built-ins, so no
    # npm install is needed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # npm test (the analytics beacon gate and the reader-facing link ref), then
      # regenerate and fail on any diff under public/. The session lives in
      # python/noxfile.py with the others; it runs node, npm and git only.
      - name: website unit tests; generated llms artifacts are current
        run: pipx run --spec "nox==$NOX_VERSION" nox -f ../python/noxfile.py --no-venv --no-install -s docs-llms-drift

  ci-ok:
    # #755: the one required status check. Branch protection requires only this
    # job, so renaming a job or changing a matrix never silently drops a
    # required check. `needs:` lists EVERY other job in this file (a new job is
    # added here in the same PR; tests/unit/test_ci_workflows.py asserts it).
    # `if: always()` so it still reports when a dependency failed: a skipped
    # required check would otherwise count as passing. `skipped` is a pass
    # (`new-dependencies` only runs on PRs); `failure` and `cancelled` are not.
    if: always()
    needs:
      - base-only
      - all-extra-resolves
      - typecheck-and-lint
      - new-dependencies
      - commit-identities
      - test
      - anthropic-stacks
      - adk-stacks
      - agent-framework-middleware
      - llamaindex-transport
      - agents-strands-last-call
      - adapter-contract
      - benchmark
      - quickstart
      - langgraph-demo
      - docs-llms-drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        # No checkout here, so python/ does not exist.
        working-directory: .
    steps:
      - name: every CI job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::CI jobs did not succeed:"
            echo "$failed"
            exit 1
          fi
          echo "All CI jobs succeeded or were skipped."
