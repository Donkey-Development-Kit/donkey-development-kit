name: Rebrand completeness

# Tree-wide guard (#340, plan S14): fails if any DDK-owned identifier still
# carries the old "Agent Fabric SDK" branding. Runs at the repo root (unlike
# the Python CI, which defaults to python/), because the check spans the whole
# tree — docs, website, spec, skills, workflows, and code.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the guard only reads the checkout, never writes back.
permissions:
  contents: read

jobs:
  rebrand-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate reads the working tree via `git grep`, so the default
          # shallow checkout is enough.
          fetch-depth: 1
      - name: Rebrand completeness gate
        run: bash scripts/check-rebrand.sh
