name: Action self-test

# #219: runs the scan-and-publish action (action/) from this checkout, as a
# user's workflow would, against action/tests/fixture. A dry run, so it needs no
# credentials and runs on fork PRs too. Its own workflow, not a ci.yml job:
# every ci.yml job is a nox session, and this one can only run on a runner.
# `./action`, not GitHub's `$/action` self-repository form that zizmor
# suggests: the actionlint workflow-lint pins does not parse `$/` yet.
# tests/unit/test_action.py covers run.py itself.

on:
  push:
    branches: [main, develop]
    paths:
      - "action/**"
      - "python/src/**"
      - "python/pyproject.toml"
      - ".github/workflows/action-self-test.yml"
  pull_request:
    paths:
      - "action/**"
      - "python/src/**"
      - "python/pyproject.toml"
      - ".github/workflows/action-self-test.yml"

# Least privilege: this workflow only reads the checkout, never writes back.
permissions:
  contents: read

jobs:
  dry-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        uses: ./action # zizmor: ignore[self-repository]
        with:
          path: action/tests/fixture
          dry-run: "true"
      - name: check the outputs and the result
        shell: bash
        env:
          PUBLISHED: ${{ steps.plan.outputs.published }}
          RESULT: ${{ steps.plan.outputs.result }}
        run: |
          test "$PUBLISHED" = 0
          jq -e '[.assets[].asset_id] == ["sku-manager"] and .issues == []' "$RESULT"
      # A path with nothing to scan: the step fails, and the job goes on to
      # check that it did. Its error annotation is expected.
      - id: missing
        uses: ./action # zizmor: ignore[self-repository]
        continue-on-error: true
        with:
          path: action/tests/no-such-directory
          dry-run: "true"
      - name: check that the missing path failed the step
        shell: bash
        env:
          OUTCOME: ${{ steps.missing.outcome }}
        run: test "$OUTCOME" = failure
