name: Docs (GitHub Pages)

# Deploys the Nextra consumer site (website/) to GitHub Pages as a static
# export. Bucket A of the docs split (#144); contributor docs stay in-repo and
# are NOT published here.
#
# One-time manual step: repo Settings → Pages → Source = "GitHub Actions".
# The workflow cannot flip that switch.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  # A rebuild every 6 hours refreshes the Roadmap snapshot (data/roadmap.json) that
  # visitors without JavaScript, and search indexing, see.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

# Least privilege + the OIDC token deploy-pages needs to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize publishes; never cancel a deploy that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Scheduled runs start from the default branch (develop); always publish main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Build static export (served under the project sub-path)
        run: npm run build
        env:
          DOCS_BASE_PATH: /donkey-development-kit
          GITHUB_TOKEN: ${{ github.token }}
      - name: Disable Jekyll so Pages serves Next's _next/ directory
        run: touch out/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
