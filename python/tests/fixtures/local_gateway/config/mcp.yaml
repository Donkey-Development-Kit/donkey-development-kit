apiVersion: gateway.mulesoft.com/v1alpha1
kind: ApiInstance
metadata:
  name: ddk-mcp-verification
spec:
  address: http://0.0.0.0:8084
  services:
    unavailable-upstream:
      address: http://127.0.0.1:18081
  policies:
    - policyRef:
        name: mcp-support
      config:
        injectMcpNameHeaders: true
