apiVersion: gateway.mulesoft.com/v1alpha1
kind: ApiInstance
metadata:
  name: ddk-injection-verification
spec:
  address: http://0.0.0.0:8082
  services:
    unavailable-upstream:
      address: http://127.0.0.1:18081
  policies:
    - policyRef:
        name: injection-protection-flex
      config:
        builtInProtections: [sql, xss]
        customProtections: []
        protectPathAndQuery: true
        protectHeaders: false
        protectBody: true
        rejectRequests: true
