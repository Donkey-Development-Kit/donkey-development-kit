# Every direct dependency of donkey-kit is a reviewed decision (#936).
#
# One [packages.<name>] table per distribution named in pyproject.toml's
# `dependencies`, any extra, or any dependency group, keyed by its PEP 503 name
# (lowercase, hyphens). `reason` says why the SDK needs it and where; `reviewed`
# is the date a maintainer last confirmed that.
#
# tests/unit/test_house_style_config.py fails when a declared name is missing
# here or an entry outlives its declaration. On a PR that adds a name,
# scripts/check_new_dependencies.py also checks it exists on PyPI and warns on a
# young, abandoned, or lookalike project. Add the entry in the same PR as the
# dependency, so the review sees both.

# --- Base install: core/ is framework-free (§1.1) ---

[packages.httpx]
reason = "The one transport: DonkeyAsyncClient is an httpx.AsyncClient subclass (BG §1.1)."
reviewed = 2026-10-03

[packages.typing-extensions]
reason = "Backfills typing features below Python 3.12 (3.10 floor)."
reviewed = 2026-10-03

[packages.tomli]
reason = "Backfills stdlib tomllib below Python 3.11 for config.py and governance.py (3.10 floor)."
reviewed = 2026-10-03

